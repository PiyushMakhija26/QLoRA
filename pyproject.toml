[project]
name = "invoice-extractor"
version = "0.1.0"
description = "QLoRA fine-tuning pipeline for structured invoice extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.42.0",
    "peft>=0.11.0",
    "bitsandbytes>=0.43.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
    "hydra-core>=1.3.2",
    "pydantic>=2.7.0",
    "wandb>=0.17.0",
    "scipy>=1.12.0",
    "tqdm>=4.66.0",
    "jinja2>=3.1.0",
    "huggingface-hub>=0.23.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-tqdm>=4.66.0",
    "pre-commit>=3.7.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_extractor"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "ARG", "RUF"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_configs = true

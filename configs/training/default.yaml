learning_rate: 2e-4
num_train_epochs: 3
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
gradient_checkpointing: true
weight_decay: 0.01
lr_scheduler_type: "cosine"
warmup_ratio: 0.03
logging_steps: 10
eval_steps: 50
evaluation_strategy: "steps"
save_strategy: "steps"
save_steps: 50
save_total_limit: 2
output_dir: "./outputs"
bf16: true
fp16: false
report_to: "wandb"
